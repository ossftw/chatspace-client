<!DOCTYPE html>
<html>
	<head>
		<title>Chat Space - Login</title>
		<meta name="description" content="Chat Space - Simple Invite-Based Server and Channel chatting Website with server moderation features." />
		<meta name="application-name" content="Chat Space" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="stylesheet" id="style" href="/style/dark.css" />
	</head>
	<body>
		<center>
		<h3>Log In</h3>
		<input id="acc-user" placeholder="Username" maxlength="64" autocomplete="off" />
		<br>
		<input id="acc-pass" type="password" placeholder="Password" maxlength="8192" autocomplete="off" />
		<br>
		<br>
		<button id="acc-login" type="Button">Login</button>
		<button id="acc-create" type="button">Create</button>
		<br>
		<br>
		<select id="themes-list"></select>
		<br>
		<br>
		<p id="output">Log in or create an account.</p>
		</center>
	</body>
	<script src="/style/index.js"></script>
	<script src="../client.js"></script>
	<script src="script.js"></script>
</html>
