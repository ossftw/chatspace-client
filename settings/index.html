<!DOCTYPE html>
<html>
	<head>
		<title>Chat Space - Settings</title>
		<meta name="description" content="Chat Space - Simple Invite-Based Server and Channel chatting Website with server moderation features." />
		<meta name="application-name" content="Chat Space" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="stylesheet" id="style" href="/style/dark.css" />
	</head>
	<body>
		<ul class="bar" id="bar">
		</ul>
		<div style="margin-left:25%;padding:1px 16px;height:1000px;" id="main">
		<center>
		<h2>Account</h2>
		<input id="acc-display-name" placeholder="Display Name" maxlength="64" autocomplete="off" />
		<br>
		<input type="password" id="acc-password" placeholder="Password" maxlength="8192" autocomplete="off" />
		<br>
		<button id="set-name" type="button">Set Name</button>
		<br>
		<p id="set-name-output"></p>
		<br>
		<input type="color" id="acc-color" />
		<br>
		<button id="set-color" type="button">Set Color</button>
		<br>
		<button id="reset-color" type="button">Reset Color</button>
		<br>
		<p id="set-color-output"></p>
		<input type="color" id="acc-color2" />
		<br>
		<button id="set-color2" type="button">Set Color2</button>
		<br>
		<button id="reset-color2" type="button">Reset Color2</button>
		<br>
		<p id="set-color2-output"></p>
		<input id="acc-bio" placeholder="About Me" maxlength="1024" autocomplete="off" />
		<br>
		<button id="set-bio" type="button">Set About Me</button>
		<br>
		<p id="set-bio-output"></p>
		<br>
		<button id="log-out" type="button">Log Out</button>
		<br>
		<p id="acc-info"></p>
		<button id="get-acc-info" type="button">Get Account Info</button>
		<br>
		<br>
		<input type="password" id="acc-password-old" placeholder="Old Password" maxlength="8192" autocomplete="off" />
		<br>
		<input type="password" id="acc-password-new" placeholder="New Password" maxlength="8192" autocomplete="off" />
		<br>
		<button id="acc-password-reset" type="button">Reset Password</button>
		<br>
		<p id="reset-output"></p>
		<br>
		<h2>Appearance</h2>
		<select id="themes-list"></select>
		<br>
		<input id="hidetime" type="checkbox"/><span>Hide Timestamps in Chat</span><br>
		<input id="showidschat" type="checkbox"/><span>Show IDs in Chat</span><br>
		<input id="nochatcolors" type="checkbox"/><span>No Chat Colors</span><br>
		<input id="noaudio" type="checkbox"/><span>No Audio</span><br>
		<input id="audioanytime" type="checkbox"/><span>Play Audio Anytime</span><br>
		<input id="embeds" type="checkbox"/><span>Enable Embeds</span><br>
		<input id="nogradient" type="checkbox"/><span>Disable Gradients</span><br>
		<input id="hideblocks" type="checkbox"/><span>Hide Blocked Messages</span><br>
		<button id="custom-audio" type="button">Set Custom Audio</button>
		</center>
		</div>
	</body>
	<script src="/style/index.js"></script>
	<script src="../bar.js"></script>
	<script src="../client.js"></script>
	<script src="script.js"></script>
</html>
